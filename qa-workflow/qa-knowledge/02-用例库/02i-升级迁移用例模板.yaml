# 升级迁移用例模板（02i）——覆盖安装/数据保留/回滚
id: UPGR-<编号>
name: <升级场景标题>
tags: [upgrade]
allure:
  epic: <产品域>
steps:
  preconditions:
    - "旧版本安装并产生本地数据（登录态/配置/下载内容/缓存）"
    - "记录升级前数据清单（关键字段截图+值登记）"
  upgrade:
    - "覆盖安装新版本（adb install -r 不卸载）"
  verify:
    - 数据保留: "升级后本地数据逐项对照——登录态/配置/内容/缓存各自动保留或按声明的迁移规则变化"
    - 功能可用: "核心路径冒烟（升级后首启）"
    - 首启表现: "迁移耗时/白屏时长/存储变化"
  rollback:
    - "回滚旧版本验证（数据兼容性降级）"
record:
  判定: "数据丢失/损坏/迁移超时 → L1-L2 级 BUG"
