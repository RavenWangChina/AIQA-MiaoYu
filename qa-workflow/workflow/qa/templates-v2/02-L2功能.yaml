# 双通道标注: channels: [assertion] / [assertion, visual]
# Maestro tag 对齐: tags: [smoke|L2|L3|L4, flaky?, experimental?]
# Allure 层级: epic / feature / story
# L2 功能用例（含用例设计方法字段——逆向从重点用）
task_id: ""
name: ""
epic: ""; feature: ""; story: ""
tags: [L2]
channels: [assertion]
method_design:            # 用例设计方法（至少用一种）
  equivalence_classes: [] # 等价类表: [{class, input, expected}]
  boundary_values: []     # 边界值: [{field, value, expected}]
  decision_table: []      # 判定表: [{conditions[], actions[]}]
  state_transition: []    # 状态迁移: [{from, event, to, guard}]
  error_guessing: []      # 错误推测
precondition: ""
steps:
  - do: ""
    expect: ""
device: none
automation_guidance:          # Maestro 实现规范（官方防 flaky，v1.1 起强制）
  selector_priority: "稳定文本 text > resource-id > 关系选择器(below/childOf) > 状态条件(enabled) > index 兜底；禁用坐标"
  waiting: "轮询断言代替 sleep：assertVisible / assertNotVisible 自带等待，禁止写死等待时长"
  animation: "有动画的界面交互前先 waitForAnimationToEnd"
  network: "长网络操作用 extendedWaitUntil 设真实超时"
  ghost_tap: "tapOn 加 retryTapIfNoChange: true"
  pattern: "tapOn: {text: X, enabled: true} + assertVisible: 结果 组合，全程零固定 sleep"
