task_design:
  template: "02k-逆向对抗矩阵.yaml"
  module: "module-17-search"
  matrix:
    - dimension: "空值"
      input: "null, empty string, and whitespace-only synthetic query"
      expected: "no network request; validation/empty state is explicit; UI remains usable"
      exit_code: "N/A"
      recovery: "enter an accepted synthetic keyword"
      repro_count: 0
      evidence: "validation state and request counter"
    - dimension: "超长"
      input: "synthetic query exceeding documented maximum by one and by 10x"
      expected: "bounded input handling; no overflow or unbounded request payload"
      exit_code: "N/A"
      recovery: "replace with bounded synthetic query"
      repro_count: 0
      evidence: "input length, rendered state, request payload length"
    - dimension: "非法格式"
      input: "control characters, unsupported separators, and malformed encoded text"
      expected: "rejected or safely normalized according to contract; no route injection"
      exit_code: "N/A"
      recovery: "clear and enter a valid synthetic query"
      repro_count: 0
      evidence: "validation result and route/request trace"
    - dimension: "断网"
      input: "network unavailable before request and during response"
      expected: "bounded error state with retry affordance; no infinite spinner"
      exit_code: "N/A"
      recovery: "restore synthetic network stub and retry once"
      repro_count: 0
      evidence: "network state, timeout/error, retry count"
    - dimension: "中断"
      input: "leave search route, background app, or cancel request during loading"
      expected: "request is cancelled/ignored safely; stale response cannot update disposed view"
      exit_code: "N/A"
      recovery: "re-enter search route and issue a new synthetic query"
      repro_count: 0
      evidence: "lifecycle events, cancellation state, post-return UI state"
    - dimension: "并发"
      input: "submit two different synthetic queries in rapid succession"
      expected: "latest request wins or requests are serialized by contract; no cross-query result mixing"
      exit_code: "N/A"
      recovery: "wait for the authoritative request and clear stale loading state"
      repro_count: 0
      evidence: "request IDs/order, query-to-result mapping, final state"
    - dimension: "权限"
      input: "history storage unavailable and platform result action denied"
      expected: "permission error is explicit; search results remain isolated and app does not crash"
      exit_code: "N/A"
      recovery: "grant synthetic permission in stub and retry the isolated operation"
      repro_count: 0
      evidence: "permission response, fallback UI, retry outcome"
precondition: "Search route and deterministic synthetic stubs are available; no real account, production endpoint, or external artifact is required"
steps:
